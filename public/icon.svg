      <stop offset="0%" stop-color="#032212" />
      <stop offset="100%" stop-color="#1a3826" />
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b7e9c3" />
      <stop offset="100%" stop-color="#81a28a" />
