  <path d="M256 130 Q270 100 256 70" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M292 140 Q305 110 292 80" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8" />
  <!-- Pot rim -->
