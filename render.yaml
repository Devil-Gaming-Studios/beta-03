services:
  - type: web
    name: beta-03
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: DATABASE_URL        # Supabase *Session pooler* string (Render cannot reach the IPv6-only direct host)
        sync: false
      - key: SYNC_SECRET
        sync: false
      - key: SYNC_MIN_PASSWORD
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: APP_AUTH_TOKEN
        sync: false
      - key: TOKEN_ENCRYPTION_KEYS
        sync: false
      - key: TOKEN_ENCRYPTION_ACTIVE_KEY_ID
        sync: false
      - key: TELEGRAM_BOT_SECRET_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_CHAT_IDS
        sync: false
